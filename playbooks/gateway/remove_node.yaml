- hosts: gateway
  tasks:
  - name: Remove [Peer] blocks from wg0-gw.conf
    ansible.builtin.blockinfile:
      path: /etc/wireguard/wg0-gw.conf
      marker: "# {mark} for {{ item }}"
      state: absent
    loop: "{{ groups['nodes'] }}"

  - name: Restart wg-quick
    ansible.builtin.systemd:
      name: "wg-quick@{{ interface }}"
      state: restarted

