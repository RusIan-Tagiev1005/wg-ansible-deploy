[all:vars]
# listen_port is port that nodes and gateway uses.
listen_port=51820


# [gateway] section for setting vpn's gateway args(ip/domain , vpn ip)
[gateway]
# In gateway case ansible_host also are endpoint -> files/wg0-n.conf
#
#					U can set any net u want for VPN. 
#					In this case its 10.0.0.1/24
#					  V
# node1 ansible_host=192.168.1.202 wg_ip=10.0.0.1 
node_gw ansible_host=192.168.1.202 wg_ip=10.0.0.1 


# [nodes] section for setting vpn's nodes args
[nodes]
#	name of host uses in keys' names 
#	./files/{hostname}_public
#
# can be literally any name as u want
# |
# |
# |
# |					
# |	node's ip/domain via playbooks 	node's ip in VPN -> files/wg0*.conf
# |	gets access	|		|
# V	    		V		V
# node0 ansible_host=192.168.1.2 wg_ip=10.0.0.2 
# node1 ansible_host=192.168.1.3 wg_ip=10.0.0.3
node0 ansible_host=192.168.1.201 wg_ip=10.0.0.2 
node3 ansible_host=192.168.1.200 wg_ip=10.0.0.3


[gateway:vars]
ansible_user=root
service=wg-quick@wg0-gw

#The gateway interface through which 
#nodes is accessed -> wg0-gw.conf
gateway_interface = enp1s0


[nodes:vars]
ansible_user=root
service=wg-quick@wg0-n
